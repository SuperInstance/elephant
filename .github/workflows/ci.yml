name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: test_doc_space_ingests_real_git_log reads the real
          # git log (a shallow clone would hand it a single commit).
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          # CPU torch only — the learned tests run on CPU and this skips the
          # multi-GB CUDA wheel. torch is needed so test_learned.py and
          # test_contrast.py run instead of skip; scipy comes via .[dev]
          # (contrast.vmf_fit_generic uses scipy Bessel ratios).
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install .[dev]
      - name: Run tests
        run: python -m pytest -q
